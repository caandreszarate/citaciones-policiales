# Configuracion local de Supabase (supabase start). El proyecto en la nube se
# configura desde el panel; lo relevante aqui es que el registro publico de
# usuarios queda desactivado en ambos entornos.
project_id = "citaciones-policiales"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false
