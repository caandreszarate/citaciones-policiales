# Configuracion del proyecto de Supabase.
#
# Se aplica al proyecto remoto con `supabase config push`, de modo que ajustes
# como "no permitir el alta libre de usuarios" quedan versionados aqui en lugar
# de depender de que alguien recuerde pulsar un interruptor en el panel.
project_id = "citaciones-policiales"

[api]
enabled = true
port = 54321
# Solo se expone el esquema public. auth y storage no son accesibles por la API.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Tope de filas por peticion: el historial pagina, y nada deberia pedir mas.
max_rows = 200

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true

# Aplicacion publicada en GitHub Pages.
site_url = "https://caandreszarate.github.io/citaciones-policiales"
# El retorno de la recuperacion de contrasena llega a la raiz de la aplicacion,
# con los datos en el fragmento o en la cadena de consulta. Se admiten las formas
# con y sin barra final, y el comodin para no depender de como los componga
# GoTrue.
additional_redirect_urls = [
  "https://caandreszarate.github.io/citaciones-policiales",
  "https://caandreszarate.github.io/citaciones-policiales/",
  "https://caandreszarate.github.io/citaciones-policiales/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# NO hay registro publico de usuarios. Las cuentas las crea la administracion
# desde el panel y se autorizan poniendo profiles.is_admin = true.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
# CUIDADO con el nombre: `[auth.email] enable_signup` NO significa "permitir
# altas por correo". La CLI lo traduce a `external_email_enabled`, que es el
# interruptor "Enable email provider" del panel. Ponerlo a false apaga el inicio
# de sesion por correo Y los correos de recuperacion de contrasena.
#
# Debe quedarse en TRUE. Quien impide el registro publico es `[auth] enable_signup
# = false` de la seccion anterior, que se traduce a `disable_signup = true` y
# bloquea cualquier alta, venga por donde venga.
enable_signup = true

# No hace falta confirmar por correo: las cuentas las crea la administracion,
# que ya marca "Auto Confirm User".
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
# Minimo por encima del de Supabase (6). Es un sistema policial.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.sms]
enable_signup = false
enable_confirmations = false
